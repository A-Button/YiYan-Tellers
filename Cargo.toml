[package]
name = "yyts"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
rand = "0.9.2"
serde_json = "1.0.145"
memmap2 = "0.9.5"
unicode-width = "0.2.0"
libc = "0.2"

[dev-dependencies]
criterion = "0.7.0"

[[bench]]
name = "benchmark"
harness = false
path = "benches/benchmark.rs"

# 一次性 CLI：LTO + 单 codegen unit 换更短的启动与执行时间，
# panic=abort 去掉 unwind 表。
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
